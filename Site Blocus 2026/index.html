<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Communes de France</title>
<link rel="stylesheet" href="build/carte-boutons.css">
<link rel="stylesheet" href="build/rev-panneau.css">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    /* La couleur du texte se pose ici, et non pas seulement sur body : sinon
       elle dépendrait de celle que le navigateur invente — le noir en clair,
       le blanc en sombre. Les deux sont proches de --texte, mais ce sont deux
       couleurs que la page ne contrôle pas, et c'est le texte de toute la
       carte. */
    overflow: hidden; background: var(--fonds); color: var(--texte);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  #map {
    display: block; width: 100%; height: 100%;
    cursor: grab; touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  #map.dragging { cursor: grabbing; }
  #root { will-change: transform; }

  /* ---------------- barre du haut : menus et filtre ----------------
     Elle est posée sur toutes les pages, donc la carte doit commencer en
     dessous. Sa hauteur est mesurée par la page et passée dans --haut :
     le nombre d'entrées de la barre change selon la largeur de l'écran, on ne
     peut donc pas l'écrire en dur dans la feuille de style. */
  /* Son apparence est celle de build/nav.js, qui l'injecte partout ; il ne
     reste ici que la façon dont elle est posée sur la page. */
  #topbar { position: fixed; z-index: 26; top: 0; left: 0; right: 0; }

  /* Ce que la barre caches : tout ce qui est calé sur le bord supérieur doit
     descendre d'autant. */
  #depbar { top: calc(var(--haut, 46px) + 14px); }
  #panneau { top: calc(var(--haut, 46px) + 12px); }
  #panelBtn { top: calc(50% + var(--haut, 46px) / 2); }
  #wait { top: calc(var(--haut, 46px) + 14px); }
  #accueil { padding-top: calc(var(--haut, 46px) + clamp(1rem, 4vh, 3rem)); }
  @media (max-width: 619px) {
    #panneau { max-height: calc(48vh - var(--haut, 46px) - 6px); }
    #panelBtn { bottom: calc(52vh + 14px); top: auto; }
  }

  /* ---------------- communes ----------------
     Le trait est gris et non blanc : les communes se touchent, et sur un fond
     blanc un liseré blanc ferait disparaître la frontière du département. */
  .com {
    stroke: var(--bord-2); stroke-width: .5; stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    transition: filter .12s ease, stroke .12s ease;
    cursor: pointer;
  }
  .com:hover { filter: brightness(.9) saturate(1.1); }
  /* .hl : survol d'une ligne de la liste ; .sel : commune sélectionnée.
     Les deux règles ont la même spécificité, donc l'ordre compte : .sel passe
     en dernier pour l'emporter quand une commune est à la fois survolée et
     sélectionnée. */
  .com.hl { stroke: var(--lien); stroke-width: 1.5; }
  .com.sel { stroke: var(--texte); stroke-width: 1.8; }

  /* ---------------- infobulle ---------------- */
  #tip {
    position: fixed; z-index: 20; top: 0; left: 0;
    pointer-events: none; opacity: 0;
    padding: 5px 9px; border-radius: 5px;
    background: var(--fonds-veile); border: 1px solid var(--bord);
    box-shadow: 0 2px 8px var(--ombre);
    white-space: nowrap; transition: opacity .1s ease;
  }
  #tip.on { opacity: 1; }
  #tip .n { font-weight: 600; color: var(--texte); }
  #tip .c { color: var(--texte-3); margin-left: 7px; font-variant-numeric: tabular-nums; }

  /* ---------------- panneau latéral ---------------- */
  /* La distance au bord gauche, et la distance au bord supérieur que la barre
     du haut réclame, sont posées plus haut (voir « Ce que la barre caches »).
     Les répéter ici les annulerait : à spécificité égale, c'est la dernière
     règle qui gagne, et le panneau repartirait se glisser sous la barre. */
  #depbar {
    position: fixed; z-index: 21; left: 14px;
    display: none; flex-direction: column; gap: 8px;
    width: 248px; max-width: calc(100vw - 28px);
    /* la colonne ne doit jamais déborder sous le bas de la fenêtre : c'est la
       liste des communes qui se rétrécit, le reste garde sa hauteur. Les 42px
       laissés en bas sont ceux de la signature, posée dans ce coin. */
    max-height: calc(100vh - var(--haut, 46px) - 42px);
  }
  #depbar.on { display: flex; }
  #back {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 6px; border: 1px solid var(--bord);
    background: var(--fonds-veile); color: var(--texte); text-decoration: none;
    font: 600 13px/1 inherit;
    box-shadow: 0 2px 8px var(--ombre);
  }
  #back:hover { border-color: var(--bord-2); }
  #dephead {
    padding: 10px 12px 11px; border-radius: 7px;
    background: var(--fonds-veile); border: 1px solid var(--bord);
    box-shadow: 0 4px 18px var(--ombre);
  }
  #dephead .t { font-weight: 600; font-size: 15px; color: var(--texte); letter-spacing: -.2px; }
  #dephead .s { margin-top: 2px; font-size: 11.5px; color: var(--texte-3); }
  #dephead .r {
    display: flex; align-items: center; gap: 7px;
    margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--bord);
    font-size: 12.5px; color: var(--texte);
  }
  #dephead .r .dot {
    width: 9px; height: 9px; border-radius: 50%; flex: none;
    background: var(--bord); box-shadow: inset 0 0 0 1px var(--ombre);
  }
  #dephead .r .pct { margin-left: auto; font-variant-numeric: tabular-nums; }
  #search {
    width: 100%; padding: 7px 10px; border-radius: 6px;
    border: 1px solid var(--bord); background: var(--fonds-veile);
    font: 13px/1.3 inherit; color: var(--texte);
  }
  #search:focus { outline: none; border-color: var(--texte-3); }
  #list {
    /* 44vh suffit quand la fenêtre est haute, mais sur un écran court la
       colonne entière dépassait le bas. flex: 1 / min-height: 0 laissent la
       liste absorber ce qui reste, et sa propre hauteur maximale continue de
       borner le cas courant. */
    flex: 1 1 auto; min-height: 46px;
    max-height: min(44vh, 372px); overflow-y: auto; overscroll-behavior: contain;
    border-radius: 7px; border: 1px solid var(--bord);
    background: var(--fonds-veile); box-shadow: 0 4px 18px var(--ombre);
  }
  #list .it {
    display: flex; align-items: baseline; gap: 7px;
    padding: 6px 11px; cursor: pointer; border-bottom: 1px solid var(--fonds-3);
  }
  #list .it:last-child { border-bottom: 0; }
  #list .it:hover, #list .it.on { background: var(--fonds-3); }
  #list .nm { color: var(--texte); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list .cp { color: var(--texte-3); font-size: 11px; font-variant-numeric: tabular-nums; margin-left: auto; flex: none; }
  #list .vide { padding: 11px 12px; color: var(--texte-3); font-size: 12.5px; }

  /* ---------------- panneau des collèges, lycées et blocus ----------------
     Amarré à droite, il présente deux vues : la liste des établissements de la
     commune sélectionnée, puis le détail des blocus de l'établissement choisi.
     Choisir une commune zoome la carte sur elle : le panneau n'a plus besoin
     d'être relié à un point, la commune remplit l'écran. */
  /* même raison que #depbar : le haut est posé plus haut, après la barre. */
  #panneau {
    position: fixed; z-index: 23;
    right: 12px; bottom: 12px;
    width: 272px; max-width: calc(100vw - 24px);
    display: none; flex-direction: column; overflow: hidden;
    border-radius: 9px;
    background: var(--fonds-veile); border: 1px solid var(--bord);
    box-shadow: 0 14px 34px -12px var(--ombre);
  }
  #panneau.on { display: flex; }
  #panneau .ph {
    display: flex; align-items: flex-start; gap: 8px; flex: none;
    padding: 9px 8px 8px 12px; border-bottom: 1px solid var(--bord);
    background: var(--fonds-veile);
  }
  #panneau .ph > div { min-width: 0; }
  #panneau .pn {
    font-weight: 600; font-size: 14px; color: var(--texte); line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis;
  }
  #panneau .ps { margin-top: 2px; font-size: 11.5px; color: var(--texte-3); font-variant-numeric: tabular-nums; }
  #panneau .pf {
    margin-left: auto; flex: none; width: 24px; height: 24px; padding: 0;
    border: 0; border-radius: 6px; background: transparent; cursor: pointer;
    color: var(--texte-3); font-size: 17px; line-height: 1;
  }
  #panneau .pf:hover { background: var(--fonds-3); color: var(--texte); }
  #panneau .pb {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    padding-bottom: 6px;
  }
  #panneau .pv[hidden] { display: none; }
  #panneau h4 {
    display: flex; align-items: center; gap: 6px;
    margin: 10px 12px 3px; font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .07em; color: var(--texte-3);
  }
  #panneau h4 .nb {
    font-variant-numeric: tabular-nums; letter-spacing: 0;
    background: var(--fonds-3); color: var(--texte-2); border-radius: 20px; padding: 0 6px;
  }
  #panneau .ec {
    padding: 6px 12px 7px; border-top: 1px solid var(--bord); cursor: pointer;
  }
  #panneau h4 + .ec { border-top: 0; }
  #panneau .ec:hover { background: var(--fonds-2); }
  #panneau .ec.actif { background: var(--fonds-3); box-shadow: inset 2px 0 0 var(--rouge-vif); }
  #panneau .en { display: flex; align-items: baseline; gap: 6px; }
  #panneau .en .nm { font-size: 12.5px; color: var(--texte); line-height: 1.25; }
  #panneau .bg {
    flex: none; margin-left: auto; font-size: 9.5px; font-weight: 600;
    padding: 1px 6px; border-radius: 20px; letter-spacing: .02em;
    border: 1px solid var(--bord); color: var(--texte-2); background: var(--fonds-2);
  }
  #panneau .bg.pr { border-color: var(--rouge-bord); color: var(--rouge-fonce); background: var(--rouge-pale); }
  #panneau .em { margin-top: 2px; font-size: 11.5px; color: var(--texte-3); }
  #panneau .ea { margin-top: 2px; font-size: 11.5px; }
  #panneau .ea a { color: var(--lien); text-decoration: none; }
  #panneau .ea a:hover { text-decoration: underline; }
  #panneau .vide { padding: 12px; color: var(--texte-3); font-size: 12.5px; line-height: 1.45; }

  /* vue « blocus » : retour, centrage, et un bloc par blocus */
  #panneau .ret {
    display: block; width: 100%; margin: 0; padding: 7px 12px;
    border: 0; border-bottom: 1px solid var(--bord); background: var(--fonds-2);
    font: 600 12px/1.2 inherit; color: var(--texte-2); text-align: left; cursor: pointer;
  }
  #panneau .ret:hover { background: var(--fonds-3); color: var(--texte); }
  #panneau .ctr {
    display: block; width: 100%; margin: 0; padding: 6px 12px;
    border: 0; border-bottom: 1px solid var(--bord); background: transparent;
    font: 600 11.5px/1.2 inherit; color: var(--lien); text-align: left; cursor: pointer;
  }
  #panneau .ctr:hover { background: var(--fonds-2); }
  #panneau .bl { padding: 8px 12px 9px; border-top: 1px solid var(--bord); }
  #panneau .bl:first-of-type { border-top: 0; }
  #panneau .bn { font-size: 12.5px; font-weight: 600; color: var(--texte); line-height: 1.3; }
  #panneau .bj { margin-top: 2px; font-size: 11.5px; color: var(--texte-2); }
  /* le jour affiché : on dit ce que la carte montre, pour que « aucune
     commune violette » ne se confonde pas avec « aucun blocus » */
  #panneau .pj {
    padding: 7px 12px; margin-bottom: 2px; font-size: 11px; line-height: 1.4;
    color: var(--accent); background: var(--accent-pale); border-bottom: 1px solid var(--accent-pale-2);
  }
  /* le lien qui prouve le blocus : sans lui, un blocus n'est qu'une rumeur */
  #panneau .bp { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
  #panneau .bp a { font-size: 11px; color: var(--lien); text-decoration: none; }
  #panneau .bp a:hover { text-decoration: underline; }
  /* les médias cités quand la source n'a pas donné d'adresse : c'est moins
     précis qu'un lien, mais ce n'est pas rien non plus */
  #panneau .bp .bs { font-size: 10.5px; line-height: 1.4; color: var(--texte-3); }
  #panneau .bp .bq {
    margin-left: 5px; padding: 1px 5px; border-radius: 4px;
    background: var(--fonds-3); color: var(--texte-2); font-size: 10px; font-weight: 600;
  }
  #panneau .bp > :first-child.bq { margin-left: 0; }
  /* la citation : ce que la source a écrit, mot pour mot. Elle tient lieu de
     lien quand le rapport n'a donné qu'un nom de média. Le filet violet est
     plus lisible que la teinte pâle, qui disparaissait sur fond clair. */
  #panneau .bc {
    margin: 5px 0 0; padding: 5px 8px; border-radius: 0 6px 6px 0;
    border-left: 2px solid var(--accent); background: var(--fonds-2);
    font-size: 11px; line-height: 1.45; color: var(--texte-2);
  }
  #panneau .sig {
    display: block; margin-top: 8px; padding: 7px; border-radius: 7px;
    background: var(--accent-pale); color: var(--accent-2); text-decoration: none;
    font: 600 11.5px/1.2 inherit; text-align: center;
  }
  #panneau .sig:hover { background: var(--accent-cible); }

  /* Bouton de rappel, quand le panneau est masqué */
  #panelBtn {
    position: fixed; z-index: 23; right: 0; top: 50%; transform: translateY(-50%);
    width: 22px; height: 76px; padding: 0; border-radius: 7px 0 0 7px;
    border: 1px solid var(--bord); border-right: 0; cursor: pointer;
    background: var(--fonds-veile); color: var(--texte-2); font-size: 14px;
    box-shadow: -2px 4px 12px var(--ombre);
  }
  #panelBtn:hover { color: var(--texte); background: var(--fonds); }

  /* Calque écran : les marqueurs des établissements de la commune sélectionnée.
     Il vit hors du groupe que le zoom transforme, donc les marqueurs gardent
     la même taille à toute échelle. */
  #overlay { pointer-events: none; }
  #overlay .sc { fill: var(--rouge-vif); stroke: var(--fonds); stroke-width: 1.4; }
  #overlay .sc.sec { fill: var(--bord-2); }
  #overlay .sc.sel { fill: var(--texte); stroke: var(--fonds); stroke-width: 1.8; }
  /* L'établissement que « Centrer sur l'établissement » vient d'amener au
     milieu de l'écran : son point s'entoure, sinon on ne le retrouve pas dans la
     carte agrandie. Cette passe après .sel et .sec, donc elle l'emporte sur la
     couleur du texte. */
  #overlay .sc.cent { fill: var(--rouge-vif); stroke: var(--fonds); stroke-width: 2.8; }
  /* Sauf s'il n'est pas bloqué ce jour-là : le rouge veut dire « bloqué », et il
     ne doit pas dire « on vient de le centrer ». Un tel point reste gris, et
     s'épaissit comme les autres — c'est l'épaisseur qui le rend retrouvable. */
  #overlay .sc.sec.cent { fill: var(--bord-2); }

  /* ---------------- écran d'accueil : choix du département ---------------- */
  #accueil {
    position: fixed; z-index: 21; inset: 0;
    display: none; flex-direction: column; align-items: center;
    padding: clamp(1rem, 4vh, 3rem) 1rem;
    overflow-y: auto;
  }
  #accueil.on { display: flex; }
  #accueil > * { width: 100%; max-width: 760px; }
  #accueil h1 { margin: 0; font-size: clamp(1.3rem, 3vw, 1.8rem); font-weight: 700; letter-spacing: -.02em; color: var(--texte); text-align: center; }
  #accueil p { margin: .5rem 0 1.25rem; text-align: center; color: var(--texte-2); font-size: 13.5px; }
  #depSearch {
    padding: 9px 12px; border-radius: 7px; border: 1px solid var(--bord);
    background: var(--fonds); font: 14px/1.3 inherit; color: var(--texte);
    box-shadow: 0 2px 8px var(--ombre);
  }
  #depSearch:focus { outline: none; border-color: var(--texte-3); }
  #depGrid {
    margin-top: 12px; display: grid; gap: 5px;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
  }
  #depGrid a {
    display: flex; align-items: baseline; gap: 8px;
    padding: 6px 10px; border-radius: 6px; text-decoration: none;
    background: var(--fonds-2); border: 1px solid var(--bord); color: var(--texte);
  }
  #depGrid a:hover { background: var(--fonds-3); border-color: var(--bord); }
  #depGrid a b { font-variant-numeric: tabular-nums; color: var(--texte-3); font-weight: 600; font-size: 11.5px; min-width: 22px; }
  #depGrid a span { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #accueil .aucun { color: var(--texte-3); font-size: 13px; padding: 14px 2px; text-align: center; }

  /* ---------------- messages ---------------- */
  #wait {
    position: fixed; z-index: 22; left: 50%; transform: translateX(-50%);
    padding: 7px 14px; border-radius: 6px; font-size: 13px;
    background: var(--fonds-veile); border: 1px solid var(--bord);
    box-shadow: 0 2px 8px var(--ombre); color: var(--texte-2);
    display: none; white-space: nowrap;
  }
  #wait.on { display: block; }

  /* ---------------- bouton réinitialisation ---------------- */
  #reset {
    position: fixed; z-index: 21; right: 14px; bottom: 14px;
    width: 32px; height: 32px; padding: 0; border-radius: 50%;
    background: var(--fonds-veile); border: 1px solid var(--bord);
    box-shadow: 0 2px 8px var(--ombre);
    color: var(--texte-2); font-size: 17px; line-height: 1; cursor: pointer;
    opacity: .32; transition: opacity .15s ease, color .15s ease;
  }
  #reset.on { opacity: 1; }
  #reset:hover { color: var(--texte); opacity: 1; }

  /* ---------------- la signature ---------------- */
  /* Cette page est une carte pleine fenêtre, et elle ne défile pas : un pied
     de page y serait écrit sous le bord de l'écran. La signature est donc
     posée dans le coin bas gauche, à l'endroit où une carte porte sa source.
     Elle ne capte rien au pointeur — on lit une carte en faisant glisser, et un
     texte qui attrape le clic contrarierait ça. Sur un téléphone le bas de
     l'écran est déjà pris par la colonne des communes : elle s'y cacherait, on
     ne l'affiche donc pas — l'accueil, lui, la dit en clair. */
  #signature {
    position: fixed; z-index: 19; left: 14px; bottom: 5px;
    margin: 0; pointer-events: none;
    color: var(--texte-3); font-size: 11px; line-height: 1.2; opacity: .8;
  }
  #signature .signature { margin: 0; font-size: inherit; }
  @media (max-width: 619px) { #signature { display: none; } }

  /* ---------------- boutons de zoom ---------------- */
  /* C'est build/map-zoom.js qui les pose et qui décide quand ils sont visibles ;
     leur apparence est celle de build/carte-boutons.css, que la carte de France
     partage. Il ne reste ici que la place qu'ils prennent, qui dépend du bas de
     la fenêtre et du bandeau des établissements. */
  #zoomCarte { position: fixed; right: 14px; bottom: 56px; flex-direction: column; }
  /* Sous 900 px le bas de la fenêtre est déjà pris par le bandeau des
     établissements : les deux boutons se couchent à côté du bouton de retour
     plutôt que de se poser dessus. */
  @media (max-width: 899px) {
    #zoomCarte { flex-direction: row; right: 56px; bottom: 14px; }
  }

  /* ---------------- écrans étroits : panneaux en bandeau ---------------- */
  /* Sous 900 px la carte n'a plus la place de réserver un bandeau à droite :
     le panneau se pose alors par-dessus, en laissant le bouton de
     réinitialisation visible. */
  @media (max-width: 899px) {
    #panneau { bottom: 54px; }
  }
  @media (max-width: 619px) {
    #depbar {
      left: 8px; right: 8px; width: auto; top: auto; bottom: 8px;
      max-height: 52vh;
    }
    #list { max-height: 22vh; }
    /* le panneau passe en bandeau sous la barre du haut */
    #panneau {
      bottom: auto; left: 8px; right: 8px; width: auto;
    }
    #panelBtn { top: auto; bottom: calc(52vh + 14px); height: 64px; transform: none; }
    /* une commune sélectionnée : le panneau des établissements prend le haut, la
       liste des communes se replie sur son en-tête pour laisser la carte au
       milieu (voir zone) */
    body.commune #search, body.commune #list { display: none; }
  }
</style>
<script src="build/theme.js"></script>
</head>
<body>

<svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="Carte des communes du département"></svg>

<div id="tip"><span class="n"></span><span class="c"></span></div>

<div id="accueil">
  <h1>Communes de France</h1>
  <p>Choisissez un département pour afficher ses communes et leurs limites.
     Cliquez ensuite sur une commune&nbsp;: le panneau de droite liste ses
     collèges et lycées, et le détail des blocus de chacun d'eux s'y affiche.</p>
  <input id="depSearch" type="search" placeholder="Rechercher un département…" aria-label="Rechercher un département" autocomplete="off" spellcheck="false">
  <div id="depGrid"></div>
</div>

<div id="topbar">
  <nav id="nav" aria-label="Navigation principale"></nav>
</div>

<div id="depbar">
  <a id="back" href="carte.html" title="Revenir à la carte de France">&larr;&nbsp; Carte de France</a>
  <div id="dephead" aria-live="polite">
    <div class="t"></div>
    <div class="s"></div>
    <div class="r"><span class="dot"></span><span class="who"></span><span class="pct"></span></div>
  </div>
