<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Départements — Actu Blocus</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root { --font-sys: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
html, body { margin: 0; padding: 0; font: 14.5px/1.55 var(--font-sys); background: var(--fonds); color: var(--texte); transition: background-color .15s ease, color .15s ease; }
#topbar { position: sticky; z-index: 26; top: 0; }
main { max-width: 1080px; margin: 0 auto; padding: 0 20px 3rem; }
h1 { margin: 2rem 0 .6rem; font-size: clamp(1.6rem, 4.5vw, 2.4rem); font-weight: 700; letter-spacing: -.02em; }
.chapo { margin: 0 0 2rem; color: var(--texte-2); font-size: 15px; max-width: 70ch; }
#depGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 1rem; }
#depGrid button { text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--bord); background: var(--fonds-2); color: var(--texte); cursor: pointer; box-shadow: 0 1px 2px var(--ombre); transition: .15s ease; }
#depGrid button:hover { background: var(--fonds-3); }
#depGrid button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
footer { margin-top: 2rem; color: var(--texte-3); font-size: 12.5px; }
</style>
<script src="build/theme.js"></script>
<style>html, body { background-image: url("fond du site.jpg"); background-size: cover; background-attachment: fixed; background-position: center; }
</style>
  <link rel="stylesheet" href="build/mobile-nav.css" />
</head>
<body>
<div id="topbar">
  <nav id="nav" aria-label="Navigation principale"></nav>
</div>
<main>
  <h1>Choisir un département</h1>
  <p class="chapo">Cliquez sur un département pour voir les communes et les blocus.</p>
  <div id="depGrid"></div>
  <footer>Liste des départements de France métropolitaine et d'outre-mer.</footer>
</main>
<script src="build/nav.js"></script>
<script src="build/dep-noms.js"></script>
<script>
NAV.poser("nav", "departements", { titre: "Departements" });
const grid = document.getElementById("depGrid");
const DEPS = window.DEP_FR || {};
const codes = Object.keys(DEPS).sort((a,b) => {
  const na=DEPS[a], nb=DEPS[b];
  if (na < nb) return -1; if (na > nb) return 1; return 0;
});
codes.forEach(c => {
  const btn = document.createElement("button");
  btn.textContent = DEPS[c] + " (" + c + ")";
  btn.addEventListener("click", () => { location.href = "index.html#" + c; });
  grid.appendChild(btn);
});
</script>
  <script src="build/mobile-nav.js"></script>
</body>
</html>
